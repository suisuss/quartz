name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v4
  workflow_dispatch:
  schedule:
    # Rebuild daily to pick up vault changes
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quartz
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Clone vault
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://x-access-token:${{ secrets.VAULT_TOKEN }}@github.com/suisuss/.obsidian.git \
            /tmp/vault
          cd /tmp/vault
          git sparse-checkout set "Writing" "Knowledge Base" "Files"

      - name: Copy content
        run: |
          cp -r "/tmp/vault/Writing" content/
          cp -r "/tmp/vault/Knowledge Base" content/
          cp -r /tmp/vault/Files content/

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
